<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Table Example</title>
  <style>
    table {
      border-collapse: collapse;
      width: 300px;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>


  <table>
    <tr>
      <th>名前</th>
      <th>好きな食べ物</th>
    </tr>
    <tr>
      <td>たいが</td>
      <td>ホルモン</td>
    </tr>
    <tr>
      <td>あきら</td>
      <td>ラーメン</td>
    </tr>
  </table>

</body>
</html>
